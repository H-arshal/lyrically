<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyrically</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      min-height: 160px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f14;
      color: #f0f0f5;
      padding: 0;
      overflow: hidden;
    }

    .popup-header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .popup-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .popup-brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .popup-body {
      padding: 16px 18px;
    }

    .popup-track {
      margin-bottom: 14px;
    }

    .popup-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.30);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .popup-title {
      font-size: 14px;
      font-weight: 600;
      color: #f0f0f5;
      line-height: 1.3;
    }

    .popup-artist {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
    }

    .popup-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .popup-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .popup-dot.green { background: #22c55e; }
    .popup-dot.yellow { background: #eab308; }
    .popup-dot.red { background: #ef4444; }
    .popup-dot.gray { background: rgba(255,255,255,0.20); }

    .popup-status-text {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    .popup-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .popup-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      color: #c7d2fe;
    }

    .popup-idle-msg {
      text-align: center;
      padding: 20px 10px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      line-height: 1.6;
    }

    .popup-idle-msg strong {
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">♪</div>
    <div class="popup-brand">Lyrically</div>
  </div>
  <div class="popup-body" id="popup-body">
    <div class="popup-idle-msg">
      Play a song on <strong>YouTube Music</strong> or <strong>YouTube</strong> to get started.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
